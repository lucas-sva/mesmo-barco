<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <meta name="theme-color" content="#e7edf2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Soft hint: GH Pages cannot set per-path headers; helps some browsers revalidate HTML. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta
      name="description"
      content="Mesmo Barco: projeção da fila da 2ª turma OIPCE com dados públicos do DOE."
    />
    <meta property="og:title" content="Mesmo Barco · fila OIPCE" />
    <meta
      property="og:description"
      content="Projeção da fila da 2ª turma OIPCE com dados públicos do DOE."
    />
    <meta property="og:image" content="./logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="preload"
      href="./fonts/roboto-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Self-hosted Roboto (latin); weights used: 400 / 500 / 700. Paths are ./ so GH Pages base works. -->
    <style>
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/roboto-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('./fonts/roboto-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/roboto-latin-700-normal.woff2') format('woff2');
      }
    </style>
    <title>Mesmo Barco · fila OIPCE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Contador público de acessos (mesmo badge do README); não bloqueia o app se falhar -->
    <img
      src="https://hits.sh/lucas-sva.github.io/mesmo-barco.svg"
      alt=""
      width="1"
      height="1"
      decoding="async"
      style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
    />
  </body>
</html>
